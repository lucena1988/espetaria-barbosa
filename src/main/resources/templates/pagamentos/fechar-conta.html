<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fechar Conta - Espetaria Barbosa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <strong>Espetaria Barbosa</strong>
    <a href="/dashboard">Dashboard</a>
    <a href="/pedidos">Pedidos</a>
    <a href="/pedidos/novo">Novo Pedido</a>
    <a href="/pedidos/historico">Historico</a>
    <a href="/clientes">Clientes</a>
    <a href="/mesas">Mesas</a>
    <a href="/produtos">Produtos</a>
    <a href="/cozinha">Cozinha</a>
    <a href="/painel" target="_blank">Painel TV</a>
</div>
<div class="container">
    <div class="page-header">
        <h1>Fechar Conta</h1>
        <a class="btn btn-secondary" href="/pedidos">Voltar</a>
    </div>

    <div class="card">
        <h2>#<span th:text="${pedido.id}"></span> - <span th:text="${pedido.nomeCliente}"></span></h2>
        <p>Atendimento: <span th:text="${pedido.tipoAtendimento}"></span></p>
        <p>Mesa/Referencia: <span th:text="${pedido.mesa}"></span></p>
        <p>Status: <span th:class="'status ' + ${pedido.status}" th:text="${pedido.status}"></span></p>
        <p>Total: R$ <strong th:text="${pedido.total}"></strong></p>

        <ul>
            <li th:each="item : ${pedido.itens}">
                <span th:text="${item.quantidade}"></span>x
                <span th:text="${item.nomeProduto}"></span>
                - R$ <span th:text="${item.subtotal}"></span>
            </li>
        </ul>
    </div>

    <div class="card">
        <h2>Pagamento</h2>
        <form method="post" th:action="@{/pagamentos/pedido/{id}(id=${pedido.id})}">
            <select name="formaPagamento" required>
                <option value="">Selecione a forma de pagamento</option>
                <option th:each="forma : ${formasPagamento}"
                        th:value="${forma}"
                        th:text="${forma}">
                </option>
            </select>

            <input name="valor" type="number" step="0.01" min="0.01" th:value="${pedido.total}" required>
            <button type="submit">Registrar pagamento e entregar</button>
        </form>
    </div>
</div>
</body>
</html>
