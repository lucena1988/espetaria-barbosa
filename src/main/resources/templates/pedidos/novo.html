<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Pedido - Espetaria Barbosa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <strong>Espetaria Barbosa</strong>
    <a href="/pedidos">Pedidos</a>
    <a href="/pedidos/novo">Novo Pedido</a>
    <a href="/mesas">Mesas</a>
    <a href="/produtos">Produtos</a>
    <a href="/cozinha">Cozinha</a>
    <a href="/painel" target="_blank">Painel TV</a>
</div>
<div class="container">
    <h1>Novo Pedido</h1>

    <div class="card">
        <form method="post" action="/pedidos">
            <input name="nomeCliente" placeholder="Nome do cliente" required>

            <select id="tipo-atendimento" name="tipoAtendimento" required>
                <option th:each="tipo : ${tiposAtendimento}"
                        th:value="${tipo}"
                        th:text="${tipo}">
                </option>
            </select>

            <select id="mesa-select" name="mesa">
                <option value="">Selecione a mesa</option>
                <option th:each="mesa : ${mesas}"
                        th:value="${mesa.numero}"
                        th:text="${mesa.numero + ' - ' + mesa.status}">
                </option>
            </select>

            <input id="referencia-atendimento"
                   name="mesa"
                   placeholder="Referencia. Ex: Balcao, telefone ou endereco"
                   disabled>

            <h2>Itens do pedido</h2>

            <div id="itens-pedido">
                <div class="item-row">
                    <select name="produtoIds" required>
                        <option value="">Selecione o produto</option>
                        <option th:each="produto : ${produtos}"
                                th:value="${produto.id}"
                                th:text="${produto.nome + ' - R$ ' + produto.preco}">
                        </option>
                    </select>

                    <input name="quantidades" type="number" min="1" value="1" required>
                    <button class="btn-secondary remover-item" type="button">Remover</button>
                </div>
            </div>

            <button class="btn-secondary" id="adicionar-item" type="button">Adicionar item</button>

            <button type="submit">Criar Pedido</button>
        </form>
    </div>
</div>

<script>
    const itensPedido = document.getElementById('itens-pedido');
    const adicionarItem = document.getElementById('adicionar-item');
    const tipoAtendimento = document.getElementById('tipo-atendimento');
    const mesaSelect = document.getElementById('mesa-select');
    const referenciaAtendimento = document.getElementById('referencia-atendimento');

    function atualizarBotoesRemover() {
        const linhas = itensPedido.querySelectorAll('.item-row');
        linhas.forEach((linha) => {
            const remover = linha.querySelector('.remover-item');
            remover.disabled = linhas.length === 1;
        });
    }

    function atualizarCampoAtendimento() {
        const pedidoMesa = tipoAtendimento.value === 'MESA';
        mesaSelect.disabled = !pedidoMesa;
        referenciaAtendimento.disabled = pedidoMesa;

        if (pedidoMesa) {
            referenciaAtendimento.value = '';
            mesaSelect.required = true;
            referenciaAtendimento.required = false;
            return;
        }

        mesaSelect.value = '';
        mesaSelect.required = false;
        referenciaAtendimento.required = true;
    }

    adicionarItem.addEventListener('click', () => {
        const novaLinha = itensPedido.querySelector('.item-row').cloneNode(true);
        novaLinha.querySelector('select').value = '';
        novaLinha.querySelector('input').value = 1;
        itensPedido.appendChild(novaLinha);
        atualizarBotoesRemover();
    });

    itensPedido.addEventListener('click', (event) => {
        if (!event.target.classList.contains('remover-item')) {
            return;
        }

        const linhas = itensPedido.querySelectorAll('.item-row');
        if (linhas.length > 1) {
            event.target.closest('.item-row').remove();
            atualizarBotoesRemover();
        }
    });

    tipoAtendimento.addEventListener('change', atualizarCampoAtendimento);
    atualizarBotoesRemover();
    atualizarCampoAtendimento();
</script>
</body>
</html>
