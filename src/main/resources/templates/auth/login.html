<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Espetaria Barbosa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="login-page">
    <form class="login-card" method="post" action="/login">
        <strong>Espetaria Barbosa</strong>
        <h1>Acesso ao Sistema</h1>

        <div class="error-message" th:if="${param.error}">
            Usuario ou senha invalidos.
        </div>

        <div class="success-message" th:if="${param.logout}">
            Sessao encerrada com sucesso.
        </div>

        <input name="username" placeholder="Usuario" required autofocus>
        <input name="password" type="password" placeholder="Senha" required>
        <button type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
