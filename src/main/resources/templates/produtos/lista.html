<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produtos - Espetaria Barbosa</title>
    <script>
        if (localStorage.getItem('espetariaTema') === 'light') {
            document.documentElement.classList.add('light-theme');
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <strong>Espetaria Barbosa</strong>
    <a href="/dashboard">Dashboard</a>
    <a href="/pedidos">Pedidos</a>
    <a href="/pedidos/novo">Novo Pedido</a>
    <a href="/clientes">Clientes</a>
    <a href="/mesas">Mesas</a>
    <a href="/categorias">Categorias</a>
    <a href="/produtos">Produtos</a>
    <a href="/funcionarios">Funcionarios</a>
    <a href="/cozinha">Cozinha</a>
    <a href="/painel" target="_blank">Painel TV</a>
    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" title="Alternar tema">
        <span class="theme-icon" data-theme-icon aria-hidden="true">D</span>
        <span data-theme-label>Modo light</span>
    </button>
    <form class="logout-form" method="post" action="/logout">
        <button class="btn-secondary" type="submit">Sair</button>
    </form>
</div>
<div class="container">
    <h1>Produtos</h1>

    <div class="card">
        <h2>Novo Produto</h2>
        <form method="post" action="/produtos">
            <input name="nome" placeholder="Nome do produto" required>
            <select name="categoriaId" required>
                <option value="">Selecione a categoria</option>
                <option th:each="categoria : ${categorias}"
                        th:value="${categoria.id}"
                        th:text="${categoria.nome}">
                </option>
            </select>
            <input name="preco" type="number" step="0.01" placeholder="Preco" required>
            <input name="quantidadeEstoque" type="number" min="0" value="0" placeholder="Quantidade em estoque" required>
            <input name="estoqueMinimo" type="number" min="0" value="5" placeholder="Estoque minimo" required>
            <button type="submit">Salvar Produto</button>
        </form>
    </div>

    <div class="card produto-card"
         th:each="produto : ${produtos}"
         th:classappend="${produto.esgotado()} ? ' estoque-esgotado' : (${produto.estoqueBaixo()} ? ' estoque-baixo' : ' estoque-ok')">
        <h3 th:text="${produto.nome}"></h3>
        <p>Categoria: <span th:text="${produto.categoriaProduto != null ? produto.categoriaProduto.nome : produto.categoria}"></span></p>
        <p>Preco: R$ <span th:text="${produto.preco}"></span></p>
        <p>
            Estoque:
            <strong th:text="${produto.quantidadeEstoque}"></strong>
            <span th:if="${produto.esgotado()}" class="stock-badge danger">Esgotado</span>
            <span th:if="${produto.estoqueBaixo()}" class="stock-badge warning">Estoque baixo</span>
            <span th:if="${!produto.esgotado() and !produto.estoqueBaixo()}" class="stock-badge ok">OK</span>
        </p>
        <p>Estoque minimo: <span th:text="${produto.estoqueMinimo}"></span></p>

        <form class="stock-form" method="post" th:action="@{/produtos/{id}/estoque(id=${produto.id})}">
            <input name="quantidadeEstoque" type="number" min="0" th:value="${produto.quantidadeEstoque}" required>
            <button class="btn-secondary" type="submit">Atualizar estoque</button>
        </form>
    </div>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
