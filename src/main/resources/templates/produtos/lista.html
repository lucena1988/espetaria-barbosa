<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produtos - Espetaria Barbosa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <strong>🍢 Espetaria Barbosa</strong>
    <a href="/pedidos">Pedidos</a>
    <a href="/pedidos/novo">Novo Pedido</a>
    <a href="/mesas">Mesas</a>
    <a href="/produtos">Produtos</a>
    <a href="/cozinha">Cozinha</a>
    <a href="/painel" target="_blank">Painel TV</a>
</div>
<div class="container">
    <h1>Produtos</h1>

    <div class="card">
        <h2>Novo Produto</h2>
        <form method="post" action="/produtos">
            <input name="nome" placeholder="Nome do produto" required>
            <input name="categoria" placeholder="Categoria. Ex: Espetos, Bebidas" required>
            <input name="preco" type="number" step="0.01" placeholder="Preço" required>
            <button type="submit">Salvar Produto</button>
        </form>
    </div>

    <div class="card" th:each="produto : ${produtos}">
        <h3 th:text="${produto.nome}"></h3>
        <p>Categoria: <span th:text="${produto.categoria}"></span></p>
        <p>Preço: R$ <span th:text="${produto.preco}"></span></p>
    </div>
</div>
</body>
</html>
