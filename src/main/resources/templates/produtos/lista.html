<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produtos - Espetaria Barbosa</title>
    <script>
        if (localStorage.getItem('espetariaTema') === 'light') {
            document.documentElement.classList.add('light-theme');
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <strong>Espetaria Barbosa</strong>
    <a th:if="${canDashboard}" href="/dashboard">Dashboard</a>
    <a th:if="${canPedidos}" href="/pedidos">Pedidos</a>
    <a th:if="${canNovoPedido}" href="/pedidos/novo">Novo Pedido</a>
    <a th:if="${canClientes}" href="/clientes">Clientes</a>
    <a th:if="${canMesas}" href="/mesas">Mesas</a>
    <a th:if="${canCadastrosAdmin}" href="/categorias">Categorias</a>
    <a th:if="${canCadastrosAdmin}" href="/produtos">Produtos</a>
    <a th:if="${canFuncionarios}" href="/funcionarios">Funcionarios</a>
    <a th:if="${canCozinha}" href="/cozinha">Cozinha</a>
    <a th:if="${canPainel}" href="/painel" target="_blank">Painel TV</a>
    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" title="Alternar tema">
        <span class="theme-icon" data-theme-icon aria-hidden="true">D</span>
        <span data-theme-label>Modo light</span>
    </button>
    <form class="logout-form" method="post" action="/logout">
        <button class="btn-secondary" type="submit">Sair</button>
    </form>
</div>
<div class="container">
    <h1>Produtos</h1>

    <p class="success-message" th:if="${sucesso}" th:text="${sucesso}"></p>
    <p class="error-message" th:if="${erro}" th:text="${erro}"></p>

    <div class="card">
        <h2>Novo Produto</h2>
        <form method="post" action="/produtos">
            <input name="nome" placeholder="Nome do produto" required>
            <select name="categoriaId" required>
                <option value="">Selecione a categoria</option>
                <option th:each="categoria : ${categorias}"
                        th:value="${categoria.id}"
                        th:text="${categoria.nome}">
                </option>
            </select>
            <input name="preco" type="number" step="0.01" placeholder="Preco" required>
            <input name="quantidadeEstoque" type="number" min="0" value="0" placeholder="Quantidade em estoque" required>
            <input name="estoqueMinimo" type="number" min="0" value="5" placeholder="Estoque minimo" required>
            <button type="submit">Salvar Produto</button>
        </form>
    </div>

    <div class="card produto-card"
         th:each="produto : ${produtos}"
         th:classappend="${produto.esgotado()} ? ' estoque-esgotado' : (${produto.estoqueBaixo()} ? ' estoque-baixo' : ' estoque-ok')">
        <h3 th:text="${produto.nome}"></h3>
        <p>Categoria: <span th:text="${produto.categoriaProduto != null ? produto.categoriaProduto.nome : produto.categoria}"></span></p>
        <p>Preco: R$ <span th:text="${produto.preco}"></span></p>
        <p>
            Estoque:
            <strong th:text="${produto.quantidadeEstoque}"></strong>
            <span th:if="${produto.esgotado()}" class="stock-badge danger">Esgotado</span>
            <span th:if="${produto.estoqueBaixo()}" class="stock-badge warning">Estoque baixo</span>
            <span th:if="${!produto.esgotado() and !produto.estoqueBaixo()}" class="stock-badge ok">OK</span>
        </p>
        <p>Estoque minimo: <span th:text="${produto.estoqueMinimo}"></span></p>

        <details class="product-edit-panel">
            <summary>Editar produto</summary>
            <form class="product-edit-form" method="post" th:action="@{/produtos/{id}/editar(id=${produto.id})}">
                <input name="nome" th:value="${produto.nome}" placeholder="Nome do produto" required>
                <select name="categoriaId" required>
                    <option value="">Selecione a categoria</option>
                    <option th:each="categoria : ${categorias}"
                            th:value="${categoria.id}"
                            th:selected="${produto.categoriaProduto != null and categoria.id == produto.categoriaProduto.id}"
                            th:text="${categoria.nome}">
                    </option>
                </select>
                <input name="preco" type="number" step="0.01" min="0" th:value="${produto.preco}" placeholder="Preco" required>
                <input name="quantidadeEstoque" type="number" min="0" th:value="${produto.quantidadeEstoque}" placeholder="Quantidade em estoque" required>
                <input name="estoqueMinimo" type="number" min="0" th:value="${produto.estoqueMinimo}" placeholder="Estoque minimo" required>
                <button class="btn-secondary" type="submit">Salvar alteracoes</button>
            </form>
        </details>

        <form class="stock-form" method="post" th:action="@{/produtos/{id}/estoque(id=${produto.id})}">
            <input name="quantidadeEstoque" type="number" min="0" th:value="${produto.quantidadeEstoque}" required>
            <button class="btn-secondary" type="submit">Atualizar estoque</button>
        </form>

        <form class="product-delete-form"
              method="post"
              th:action="@{/produtos/{id}/excluir(id=${produto.id})}"
              onsubmit="return confirm('Deseja excluir este produto da tela? Pedidos antigos continuam registrados.');">
            <button class="btn-danger" type="submit">Excluir produto</button>
        </form>
    </div>

    <section class="card archived-products" th:if="${!#lists.isEmpty(produtosInativos)}">
        <div class="section-title-row">
            <div>
                <span class="eyebrow">Arquivados</span>
                <h2>Produtos excluidos da tela</h2>
            </div>
        </div>

        <div class="archived-product-row" th:each="produto : ${produtosInativos}">
            <div>
                <strong th:text="${produto.nome}"></strong>
                <span th:text="${produto.categoriaProduto != null ? produto.categoriaProduto.nome : produto.categoria}"></span>
            </div>
            <form method="post" th:action="@{/produtos/{id}/reativar(id=${produto.id})}">
                <button class="btn-secondary" type="submit">Reativar</button>
            </form>
        </div>
    </section>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
