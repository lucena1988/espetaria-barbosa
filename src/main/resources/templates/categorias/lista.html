<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias - Espetaria Barbosa</title>
    <script>
        if (localStorage.getItem('espetariaTema') === 'light') {
            document.documentElement.classList.add('light-theme');
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <strong>Espetaria Barbosa</strong>
    <a th:if="${canDashboard}" href="/dashboard">Dashboard</a>
    <a th:if="${canPedidos}" href="/pedidos">Pedidos</a>
    <a th:if="${canNovoPedido}" href="/pedidos/novo">Novo Pedido</a>
    <a th:if="${canClientes}" href="/clientes">Clientes</a>
    <a th:if="${canMesas}" href="/mesas">Mesas</a>
    <a th:if="${canCadastrosAdmin}" href="/categorias">Categorias</a>
    <a th:if="${canCadastrosAdmin}" href="/produtos">Produtos</a>
    <a th:if="${canFuncionarios}" href="/funcionarios">Funcionarios</a>
    <a th:if="${canCozinha}" href="/cozinha">Cozinha</a>
    <a th:if="${canPainel}" href="/painel" target="_blank">Painel TV</a>
    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" title="Alternar tema">
        <span class="theme-icon" data-theme-icon aria-hidden="true">D</span>
        <span data-theme-label>Modo light</span>
    </button>
    <form class="logout-form" method="post" action="/logout">
        <button class="btn-secondary" type="submit">Sair</button>
    </form>
</div>
<div class="container">
    <h1>Categorias de Produtos</h1>

    <p class="success-message" th:if="${sucesso}" th:text="${sucesso}"></p>
    <p class="error-message" th:if="${erro}" th:text="${erro}"></p>

    <div class="card">
        <h2>Nova Categoria</h2>
        <form method="post" action="/categorias">
            <input name="nome" placeholder="Nome da categoria. Ex: Espetos, Bebidas" required>
            <input name="descricao" placeholder="Descricao opcional">
            <button type="submit">Salvar Categoria</button>
        </form>
    </div>

    <p class="empty-state" th:if="${#lists.isEmpty(categorias)}">Nenhuma categoria cadastrada.</p>

    <div class="card" th:each="categoria : ${categorias}">
        <h3 th:text="${categoria.nome}"></h3>
        <p th:if="${categoria.descricao}" th:text="${categoria.descricao}"></p>
        <p>Status: <span th:text="${categoria.ativa ? 'Ativa' : 'Inativa'}"></span></p>

        <details class="record-edit-panel">
            <summary>Editar categoria</summary>
            <form class="record-edit-form" method="post" th:action="@{/categorias/{id}/editar(id=${categoria.id})}">
                <input name="nome" th:value="${categoria.nome}" placeholder="Nome da categoria" required>
                <input name="descricao" th:value="${categoria.descricao}" placeholder="Descricao opcional">
                <button class="btn-secondary" type="submit">Salvar alteracoes</button>
            </form>
        </details>

        <form class="record-delete-form"
              method="post"
              th:action="@{/categorias/{id}/arquivar(id=${categoria.id})}"
              onsubmit="return confirm('Deseja excluir esta categoria da tela? Produtos antigos continuam registrados.');">
            <button class="btn-danger" type="submit">Excluir categoria</button>
        </form>
    </div>

    <section class="card archived-records" th:if="${!#lists.isEmpty(categoriasInativas)}">
        <div class="section-title-row">
            <div>
                <span class="eyebrow">Arquivadas</span>
                <h2>Categorias excluidas da tela</h2>
            </div>
        </div>

        <div class="archived-record-row" th:each="categoria : ${categoriasInativas}">
            <div>
                <strong th:text="${categoria.nome}"></strong>
                <span th:text="${categoria.descricao ?: 'Sem descricao'}"></span>
            </div>
            <form method="post" th:action="@{/categorias/{id}/reativar(id=${categoria.id})}">
                <button class="btn-secondary" type="submit">Reativar</button>
            </form>
        </div>
    </section>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
