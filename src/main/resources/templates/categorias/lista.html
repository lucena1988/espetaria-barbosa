<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias - Espetaria Barbosa</title>
    <script>
        if (localStorage.getItem('espetariaTema') === 'light') {
            document.documentElement.classList.add('light-theme');
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <strong>Espetaria Barbosa</strong>
    <a href="/dashboard">Dashboard</a>
    <a href="/pedidos">Pedidos</a>
    <a href="/pedidos/novo">Novo Pedido</a>
    <a href="/clientes">Clientes</a>
    <a href="/mesas">Mesas</a>
    <a href="/categorias">Categorias</a>
    <a href="/produtos">Produtos</a>
    <a href="/funcionarios">Funcionarios</a>
    <a href="/cozinha">Cozinha</a>
    <a href="/painel" target="_blank">Painel TV</a>
    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" title="Alternar tema">
        <span class="theme-icon" data-theme-icon aria-hidden="true">D</span>
        <span data-theme-label>Modo light</span>
    </button>
    <form class="logout-form" method="post" action="/logout">
        <button class="btn-secondary" type="submit">Sair</button>
    </form>
</div>
<div class="container">
    <h1>Categorias de Produtos</h1>

    <div class="card">
        <h2>Nova Categoria</h2>
        <form method="post" action="/categorias">
            <input name="nome" placeholder="Nome da categoria. Ex: Espetos, Bebidas" required>
            <input name="descricao" placeholder="Descricao opcional">
            <button type="submit">Salvar Categoria</button>
        </form>
    </div>

    <p class="empty-state" th:if="${#lists.isEmpty(categorias)}">Nenhuma categoria cadastrada.</p>

    <div class="card" th:each="categoria : ${categorias}">
        <h3 th:text="${categoria.nome}"></h3>
        <p th:if="${categoria.descricao}" th:text="${categoria.descricao}"></p>
        <p>Status: <span th:text="${categoria.ativa ? 'Ativa' : 'Inativa'}"></span></p>
    </div>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
