<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mesas - Espetaria Barbosa</title>
    <script>
        if (localStorage.getItem('espetariaTema') === 'light') {
            document.documentElement.classList.add('light-theme');
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <strong>Espetaria Barbosa</strong>
    <a th:if="${canDashboard}" href="/dashboard">Dashboard</a>
    <a th:if="${canPedidos}" href="/pedidos">Pedidos</a>
    <a th:if="${canNovoPedido}" href="/pedidos/novo">Novo Pedido</a>
    <a th:if="${canClientes}" href="/clientes">Clientes</a>
    <a th:if="${canMesas}" href="/mesas">Mesas</a>
    <a th:if="${canCadastrosAdmin}" href="/categorias">Categorias</a>
    <a th:if="${canCadastrosAdmin}" href="/produtos">Produtos</a>
    <a th:if="${canFuncionarios}" href="/funcionarios">Funcionarios</a>
    <a th:if="${canCozinha}" href="/cozinha">Cozinha</a>
    <a th:if="${canPainel}" href="/painel" target="_blank">Painel TV</a>
    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" title="Alternar tema">
        <span class="theme-icon" data-theme-icon aria-hidden="true">D</span>
        <span data-theme-label>Modo light</span>
    </button>
    <form class="logout-form" method="post" action="/logout">
        <button class="btn-secondary" type="submit">Sair</button>
    </form>
</div>
<div class="container">
    <div class="page-header">
        <div>
            <h1>Mesas</h1>
            <span class="muted">Cadastre, edite e organize as mesas do atendimento</span>
        </div>
    </div>

    <p class="success-message" th:if="${sucesso}" th:text="${sucesso}"></p>
    <p class="error-message" th:if="${erro}" th:text="${erro}"></p>

    <div class="card">
        <h2>Nova Mesa</h2>
        <form method="post" action="/mesas">
            <input name="numero" placeholder="Numero da mesa. Ex: Mesa 01" required>
            <input name="descricao" placeholder="Descricao opcional. Ex: Area externa">
            <button type="submit">Salvar Mesa</button>
        </form>
    </div>

    <div class="grid">
        <div class="card mesa-card" th:each="mesa : ${mesas}">
            <h2 th:text="${mesa.numero}"></h2>
            <p th:if="${mesa.descricao}" th:text="${mesa.descricao}"></p>
            <p>Status: <span th:class="'status ' + ${mesa.status}" th:text="${mesa.status}"></span></p>
            <div class="qr-card">
                <img th:src="@{/mesas/{id}/qrcode(id=${mesa.id})}" th:alt="${'QR Code ' + mesa.numero}">
                <a class="btn btn-secondary" th:href="@{/cardapio/mesa/{id}(id=${mesa.id})}" target="_blank">
                    Abrir cardapio
                </a>
            </div>

            <form method="post" th:action="@{/mesas/{id}/status(id=${mesa.id})}">
                <select name="status">
                    <option th:each="status : ${statusMesas}"
                            th:value="${status}"
                            th:selected="${status == mesa.status}"
                            th:text="${status}">
                    </option>
                </select>
                <button type="submit">Atualizar</button>
            </form>

            <div class="mesa-actions">
                <details class="record-edit-panel">
                    <summary>Editar mesa</summary>
                    <form class="record-edit-form" method="post" th:action="@{/mesas/{id}/renomear(id=${mesa.id})}">
                        <input name="numero" th:value="${mesa.numero}" placeholder="Nome da mesa" required>
                        <input name="descricao" th:value="${mesa.descricao}" placeholder="Descricao opcional">
                        <button class="btn-secondary" type="submit">Salvar alteracoes</button>
                    </form>
                </details>

                <form method="post"
                      class="record-delete-form"
                      th:action="@{/mesas/{id}/excluir(id=${mesa.id})}"
                      onsubmit="return confirm('Deseja excluir esta mesa da tela? Pedidos antigos continuam registrados.');">
                    <button class="btn-danger" type="submit">Excluir mesa</button>
                </form>
            </div>
        </div>
    </div>

    <section class="card archived-records" th:if="${!#lists.isEmpty(mesasInativas)}">
        <div class="section-title-row">
            <div>
                <span class="eyebrow">Arquivadas</span>
                <h2>Mesas excluidas da tela</h2>
            </div>
        </div>

        <div class="archived-record-row" th:each="mesa : ${mesasInativas}">
            <div>
                <strong th:text="${mesa.numero}"></strong>
                <span th:text="${mesa.descricao ?: 'Sem descricao'}"></span>
            </div>
            <form method="post" th:action="@{/mesas/{id}/reativar(id=${mesa.id})}">
                <button class="btn-secondary" type="submit">Reativar</button>
            </form>
        </div>
    </section>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
