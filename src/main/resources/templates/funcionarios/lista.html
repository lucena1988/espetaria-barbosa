<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Funcionarios - Espetaria Barbosa</title>
    <script>
        if (localStorage.getItem('espetariaTema') === 'light') {
            document.documentElement.classList.add('light-theme');
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <strong>Espetaria Barbosa</strong>
    <a th:if="${canDashboard}" href="/dashboard">Dashboard</a>
    <a th:if="${canPedidos}" href="/pedidos">Pedidos</a>
    <a th:if="${canNovoPedido}" href="/pedidos/novo">Novo Pedido</a>
    <a th:if="${canClientes}" href="/clientes">Clientes</a>
    <a th:if="${canMesas}" href="/mesas">Mesas</a>
    <a th:if="${canCadastrosAdmin}" href="/categorias">Categorias</a>
    <a th:if="${canCadastrosAdmin}" href="/produtos">Produtos</a>
    <a th:if="${canFuncionarios}" href="/funcionarios">Funcionarios</a>
    <a th:if="${canCozinha}" href="/cozinha">Cozinha</a>
    <a th:if="${canPainel}" href="/painel" target="_blank">Painel TV</a>
    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" title="Alternar tema">
        <span class="theme-icon" data-theme-icon aria-hidden="true">D</span>
        <span data-theme-label>Modo light</span>
    </button>
    <form class="logout-form" method="post" action="/logout">
        <button class="btn-secondary" type="submit">Sair</button>
    </form>
</div>
<div class="container">
    <h1>Funcionarios</h1>

    <div class="success-message" th:if="${param.sucesso}" th:text="${param.sucesso}"></div>
    <div class="error-message" th:if="${param.erro}" th:text="${param.erro}"></div>

    <div class="card">
        <h2>Novo Funcionario</h2>
        <form method="post" action="/funcionarios">
            <input name="nome" placeholder="Nome" required>
            <input name="username" placeholder="Usuario de login" required>
            <input name="senha" type="password" placeholder="Senha" required>
            <select name="perfil" required>
                <option th:each="perfil : ${perfis}" th:value="${perfil}" th:text="${perfil.descricao}"></option>
            </select>
            <button type="submit">Cadastrar Funcionario</button>
        </form>
    </div>

    <p class="empty-state" th:if="${#lists.isEmpty(funcionarios)}">Nenhum funcionario cadastrado.</p>

    <div class="card" th:each="funcionario : ${funcionarios}">
        <h3 th:text="${funcionario.nome}"></h3>
        <p>Usuario: <span th:text="${funcionario.username}"></span></p>
        <p>Perfil: <span th:text="${funcionario.perfil.descricao}"></span></p>
        <p>Status: <span th:text="${funcionario.ativo ? 'Ativo' : 'Inativo'}"></span></p>

        <details class="record-edit-panel">
            <summary>Editar funcionario</summary>
            <form class="record-edit-form" method="post" th:action="@{/funcionarios/{id}/editar(id=${funcionario.id})}">
                <input name="nome" th:value="${funcionario.nome}" placeholder="Nome" required>
                <input name="username" th:value="${funcionario.username}" placeholder="Usuario de login" required>
                <input name="senha" type="password" placeholder="Nova senha (opcional)">
                <select name="perfil" required>
                    <option th:each="perfil : ${perfis}"
                            th:value="${perfil}"
                            th:selected="${perfil == funcionario.perfil}"
                            th:text="${perfil.descricao}">
                    </option>
                </select>
                <button class="btn-secondary" type="submit">Salvar alteracoes</button>
            </form>
        </details>

        <form class="record-delete-form"
              method="post"
              th:action="@{/funcionarios/{id}/status(id=${funcionario.id})}"
              onsubmit="return confirm('Deseja alterar o status deste funcionario?');">
            <button th:class="${funcionario.ativo} ? 'btn-danger' : 'btn-secondary'"
                    type="submit"
                    th:text="${funcionario.ativo} ? 'Desativar funcionario' : 'Ativar funcionario'">
                Alterar status
            </button>
        </form>
    </div>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
